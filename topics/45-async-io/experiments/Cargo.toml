[package]
name = "async-io-experiments"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

# Lane 2 is io_uring, which exists only on Linux. On every other OS the crate
# builds without it and the lane prints a stub note instead.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[profile.release]
debug = true
