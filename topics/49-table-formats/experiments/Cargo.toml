[package]
name = "table-formats-experiments"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1"
# The same parquet crate version the arrow-rs pin (fed7862) declares, so the
# footer decoder lane 1c times is the one reading-parquet-footer.md quotes.
# No arrow, no codecs: lane 1c writes and decodes footers, nothing else.
parquet = { version = "=59.1.0", default-features = false }

[profile.release]
debug = true
